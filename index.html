<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gozar</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      max-width: 960px;
      max-height: 540px;
      flex: 0 1 auto;
      touch-action: manipulation;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      pointer-events: none;
      font-size: clamp(11px, 1.6vw, 15px);
      gap: 8px;
      align-items: flex-start;
    }
    .ui-group { display: flex; gap: 8px; align-items: center; min-width: 0; }
    .badge {
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    #lives { letter-spacing: 1px; }
    #sound-button {
      pointer-events: auto;
      border: 0; color: #fff; cursor: pointer;
      font: inherit; font-weight: 700;
      background: rgba(0,0,0,.55); border-radius: 50%;
      min-width: 38px; min-height: 38px; padding: 5px;
      touch-action: manipulation;
    }
    #game-container.life-hit { animation: life-hit .28s ease-out; }
    @keyframes life-hit { 25% { transform: translateX(-5px); filter: saturate(1.5); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
    @media (max-width: 600px) {
      body, html { background: #080b10; }
      #game-container { width: min(100vw, calc(100vh * 16 / 9)); border-radius: 0; }
      #ui { top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; gap: 5px; font-size: clamp(9px, 2.7vw, 12px); }
      .ui-group { gap: 5px; }
      .badge { padding: 5px 8px; }
      #sound-button { min-width: 34px; min-height: 34px; }
    }
    canvas { touch-action: manipulation; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="960" height="540"></canvas>
  <div id="ui">
    <div class="ui-group"><div class="badge" id="stats">روز ۱</div><div class="badge" id="lives" aria-label="جان‌ها">❤️ ❤️ ❤️</div></div>
    <div class="ui-group"><div class="badge" id="env-info">نام محیط: هندسی | فصل: بهار | ساعت: ۰۸:۰۰</div><button id="sound-button" type="button" aria-label="قطع صدا" aria-pressed="false">🔊</button></div>
  </div>
</div>
<script>
  const GAME_VERSION = '2'; 
  const url = new URL(window.location.href);

  if (url.searchParams.get('v') !== GAME_VERSION) {
    url.searchParams.set('v', GAME_VERSION);
    window.location.replace(url.toString());
  }
</script>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statsEl = document.getElementById('stats');
  const envInfoEl = document.getElementById('env-info');
  const livesEl = document.getElementById('lives');
  const soundButton = document.getElementById('sound-button');
  const gameContainer = document.getElementById('game-container');

  // Web Audio Synth
  let audioCtx = null;
  let audioMuted = false;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function playSound(type) {
    if (!audioCtx || audioMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'jump') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(540, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    }
  }

  // دنیای بازی
  const GROUND_Y = 430;
  let gameSpeed = 6;
  const FIXED_DT = 1000 / 60;
  let accumulator = 0;
  let previousFrameTime = null;
  let simulationTime = 0;
  let lives = 3;
  let hitFlashTimer = 0;
  let lifeLost = false;
  let lastLifeReset = 0;
  let score = 0;
  let isGameOver = false;
  let hasStarted = false;

  // زمان، فصول و جهان‌ها
  let worldTime = 8.0; // شروع از ساعت 8 صبح
  let dayCount = 0;
  const seasons = ['بهار', 'تابستان', 'پاییز', 'زمستان'];
  const worlds = [
    { id: 'geometric', name: 'هندسی' },
    { id: 'blueprint', name: 'برداری' },
    { id: 'fruits', name: 'سرزمین میوه‌ها' },
    { id: 'forest', name: 'جنگل اسرارآمیز' },
    { id: 'desert', name: 'کویر طلایی' },
    { id: 'ocean', name: 'اقیانوس' },
    { id: 'volcano', name: 'آتشفشان' },
    { id: 'space', name: 'فضای کیهانی' },
    { id: 'neon', name: 'شهر نئونی' },
    { id: 'ice', name: 'سرزمین یخی' },
    { id: 'candy', name: 'دنیای آب‌نبات' },
    { id: 'farm', name: 'مزرعه' },
    { id: 'ancient', name: 'ویرانه باستانی' },
    { id: 'clouds', name: 'آسمان ابری' }
  ];

  // آب‌وهوا و پارتیکل‌ها
  const weatherParticles = Array.from({ length: 45 }, () => ({
    x: Math.random() * 960,
    y: Math.random() * 540,
    vx: (Math.random() - 0.5) * 2,
    vy: 1 + Math.random() * 3,
    size: 2 + Math.random() * 4,
    rot: Math.random() * Math.PI
  }));
  function resetWeather() {
    weatherParticles.forEach(p => {
      p.x = Math.random() * 960;
      p.y = Math.random() * 540;
      p.vx = (Math.random() - 0.5) * 2;
      p.vy = 1 + Math.random() * 3;
      p.rot = Math.random() * Math.PI;
    });
  }

  // ذرات گرد و خاکی که هنگام فرود از زیر پا پخش می‌شوند
  let dustParticles = [];
  function spawnLandingDust(centerX, y) {
    for (let i = 0; i < 6; i++) {
      dustParticles.push({
        x: centerX + (Math.random() - 0.5) * 20,
        y,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 2.5 - 0.5,
        size: 4 + Math.random() * 4,
        life: 1
      });
    }
  }
  function handleDust() {
    dustParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.05;
      ctx.save();
      ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, p.life) * 0.85})`;
      ctx.strokeStyle = `rgba(35, 35, 35, ${Math.max(0, p.life) * 0.9})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    });
    dustParticles = dustParticles.filter(p => p.life > 0);
  }

  // کاراکتر و Squash & Stretch
  const player = {
    x: 120,
    y: GROUND_Y - 50,
    prevY: GROUND_Y - 50,
    w: 48,
    h: 48,
    vy: 0,
    gravity: 0.85,
    jumpPower: -15.5,
    grounded: true,
    scaleX: 1,
    scaleY: 1,
    prevScaleX: 1,
    prevScaleY: 1,
    blinkTimer: 0,
    runTimer: 0,
    reset() {
      this.y = GROUND_Y - this.h;
      this.prevY = this.y;
      this.vy = 0;
      this.grounded = true;
      this.scaleX = 1;
      this.scaleY = 1;
      this.prevScaleX = this.scaleX;
      this.prevScaleY = this.scaleY;
    },
    jump() {
      if (this.grounded) {
        this.vy = this.jumpPower;
        this.grounded = false;
        // Stretch اولیه در لحظه پرش
        this.scaleX = 0.7;
        this.scaleY = 1.45;
        playSound('jump');
      }
    },
    update() {
      this.prevY = this.y;
      this.prevScaleX = this.scaleX;
      this.prevScaleY = this.scaleY;
      this.runTimer += 0.2;
      this.blinkTimer = (this.blinkTimer + 1) % 180;

      if (!this.grounded) {
        this.vy += this.gravity;
        this.y += this.vy;

        // تغییر پویا کشیدگی در هوا بر اساس سرعت سقوط/صعود
        const targetScaleY = 1 + Math.max(-0.35, Math.min(0.4, -this.vy * 0.035));
        const targetScaleX = 1 / targetScaleY;
        this.scaleX += (targetScaleX - this.scaleX) * 0.2;
        this.scaleY += (targetScaleY - this.scaleY) * 0.2;

        if (this.y >= GROUND_Y - this.h) {
          this.y = GROUND_Y - this.h;
          this.vy = 0;
          this.grounded = true;
          spawnLandingDust(this.x + this.w / 2, GROUND_Y);
          // Squash هنگام فرود به زمین
          this.scaleX = 1.45;
          this.scaleY = 0.65;
        }
      } else {
        // بازگشت نرم به حالت عادی
        this.scaleX += (1 - this.scaleX) * 0.18;
        this.scaleY += (1 - this.scaleY) * 0.18;
      }
    }
  };

  // موانع
  let obstacles = [];
  let spawnCooldown = 0;

  function spawnObstacle() {
    const seasonIdx = Math.floor(dayCount / 3) % 4;
    const worldIdx = Math.floor(dayCount / 12) % worlds.length;
    const world = worlds[worldIdx].id;

    // Most groups are singles; occasional pairs/triples add variety without
    // creating a long wall. Each obstacle remains safely jumpable on its own.
    const roll = Math.random();
    const count = roll < 0.58 ? 1 : (roll < 0.91 ? 2 : 3);
    let nextX = 980;
    for (let i = 0; i < count; i++) {
      const w = 29 + Math.random() * 12; // 29–41 px
      const h = 35 + Math.random() * 20; // 35–55 px
      const obs = {
        x: nextX,
        prevX: nextX,
        y: GROUND_Y - h,
        w,
        h,
        world,
        season: seasonIdx,
        shape: Math.floor(Math.random() * 3),
        rot: 0
      };
      obstacles.push(obs);
      // Tight spacing; even a triple remains a short, single-jump cluster.
      nextX += w + (i < count - 1 ? Math.random() * 4 : 0);
    }
  }

  // کوه‌ها و عناصر پس‌زمینه
  const bgMountains = Array.from({ length: 6 }, (_, i) => ({
    x: i * 220,
    w: 240 + Math.random() * 120,
    h: 120 + Math.random() * 140
  }));

  // محاسبات رنگ و فضا بر اساس ساعت
  function getSkyColors(t) {
    // بازه شب (20 تا 5)، صبح (5 تا 9)، ظهر (9 تا 17)، غروب (17 تا 20)
    if (t >= 20 || t < 5) return ['#050814', '#0d1933']; // شب
    if (t >= 5 && t < 9) return ['#355c7d', '#f8b195']; // گرگ و میش صبح
    if (t >= 9 && t < 17) return ['#6dd5ed', '#2193b0']; // روز روشن
    return ['#e65c00', '#f9d423']; // غروب طلایی
  }

  // ترسیم خورشید و ماه روی نیم‌دایرهٔ کامل، متناسب با ساعت شبانه‌روز
  function drawCelestial(t) {
    const hour = ((t % 24) + 24) % 24;

    function drawOrb(progress, isSun) {
      const theta = progress * Math.PI;
      const cx = 480 - 480 * Math.cos(theta);
      const cy = GROUND_Y - 350 * Math.sin(theta);

      ctx.save();
      ctx.fillStyle = isSun ? '#fff176' : '#f5f5f5';
      ctx.shadowColor = isSun ? '#ffb74d' : '#ffffff';
      ctx.shadowBlur = 24;

      ctx.beginPath();
      ctx.arc(cx, cy, isSun ? 26 : 18, 0, Math.PI * 2);
      ctx.fill();

      // هلال ماه
      if (!isSun) {
        ctx.fillStyle = '#0a1020';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(cx + 6, cy - 4, 15, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // خورشید فقط در بازهٔ روز رسم می‌شود.
    if (hour >= 6 && hour < 18) {
      let progress = (hour - 6) / 12;
      drawOrb(progress, true);
    }

    // ماه فقط در بازهٔ شب رسم می‌شود.
    if (hour >= 18 || hour < 6) {
      let moonOffset = hour >= 18 ? (hour - 18) : (hour + 6);
      let progress = moonOffset / 12;
      drawOrb(progress, false);
    }
  }

  // رندر پس‌زمینه
  function drawBackground(world, seasonIdx) {
    // شیب آسمان
    const sky = getSkyColors(worldTime);
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, sky[0]);
    grad.addColorStop(1, sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 960, 540);

    drawCelestial(worldTime);

    // شبکه‌بندی در حالت Blueprint
    if (world === 'blueprint') {
      ctx.strokeStyle = 'rgba(0, 255, 200, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 960; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 540); ctx.stroke();
      }
      for (let y = 0; y < 540; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(960, y); ctx.stroke();
      }
    }

    // کوه‌ها و تپه‌ها
    ctx.fillStyle = seasonIdx === 3 ? 'rgba(230,240,255,0.25)' : 'rgba(255,255,255,0.07)';
    bgMountains.forEach(m => {
      m.x -= gameSpeed * 0.15;
      if (m.x + m.w < 0) m.x = 960 + Math.random() * 80;

      ctx.beginPath();
      if (world === 'geometric') {
        ctx.moveTo(m.x, GROUND_Y);
        ctx.lineTo(m.x + m.w / 2, GROUND_Y - m.h);
        ctx.lineTo(m.x + m.w, GROUND_Y);
      } else if (world === 'fruits') {
        // تپه‌های هندوانه‌ای/گرد
        ctx.arc(m.x + m.w / 2, GROUND_Y, m.w / 2, Math.PI, 0);
      } else {
        // Blueprint خطی
        ctx.strokeStyle = 'rgba(77, 208, 225, 0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(m.x, GROUND_Y - m.h, m.w, m.h);
      }
      ctx.fill();
    });

    // جزئیات ویژه هر یک از جهان‌های افزوده‌شده
    ctx.save();
    if (world === 'forest') {
      for (let i = 0; i < 8; i++) { const x = (i * 137 + 50) % 960; ctx.fillStyle = 'rgba(20,90,48,0.42)'; ctx.fillRect(x, 250 + (i % 3) * 25, 12, 180); ctx.beginPath(); ctx.moveTo(x - 32, 310 + (i % 3) * 25); ctx.lineTo(x + 6, 220 + (i % 3) * 25); ctx.lineTo(x + 44, 310 + (i % 3) * 25); ctx.fill(); }
    } else if (world === 'desert') {
      ctx.fillStyle = 'rgba(255,220,130,0.55)'; ctx.beginPath(); ctx.arc(790, 140, 42, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,190,0.28)'; ctx.lineWidth = 3; for (let y=300;y<410;y+=24) { ctx.beginPath(); ctx.moveTo(0,y); ctx.quadraticCurveTo(480,y-18,960,y); ctx.stroke(); }
    } else if (world === 'ocean') {
      ctx.fillStyle = 'rgba(0,40,100,0.34)'; ctx.fillRect(0, 250, 960, 180);
      ctx.strokeStyle = 'rgba(120,230,255,0.48)'; ctx.lineWidth = 3; for (let y=280;y<420;y+=28) { ctx.beginPath(); for(let x=0;x<=960;x+=40){const yy=y+Math.sin((x+performance.now()*0.04)/45)*5; if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);} ctx.stroke(); }
    } else if (world === 'volcano') {
      ctx.fillStyle = 'rgba(255,70,20,0.65)'; ctx.beginPath(); ctx.moveTo(360,GROUND_Y); ctx.lineTo(515,100); ctx.lineTo(670,GROUND_Y); ctx.fill();
      ctx.fillStyle = '#ff8f00'; ctx.beginPath(); ctx.ellipse(515,175,46,12,0,0,Math.PI*2); ctx.fill();
    } else if (world === 'space') {
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; for(let i=0;i<45;i++){const x=(i*197+31)%960,y=(i*83+17)%330;ctx.fillRect(x,y,2,2);}
      ctx.fillStyle = 'rgba(130,80,200,0.35)'; ctx.beginPath(); ctx.arc(770,145,55,0,Math.PI*2); ctx.fill();
    } else if (world === 'neon') {
      for(let i=0;i<9;i++){const x=i*115;ctx.fillStyle='rgba(15,20,45,0.8)';ctx.fillRect(x,245+(i%3)*28,76,185);ctx.fillStyle='rgba(0,255,220,0.6)';for(let y=260+(i%3)*28;y<400;y+=25)ctx.fillRect(x+12,y,8,10);}
    } else if (world === 'ice') {
      ctx.fillStyle='rgba(200,245,255,0.48)'; for(let i=0;i<7;i++){const x=i*155+30;ctx.beginPath();ctx.moveTo(x,GROUND_Y);ctx.lineTo(x+28,250+(i%2)*50);ctx.lineTo(x+56,GROUND_Y);ctx.fill();}
    } else if (world === 'candy') {
      for(let i=0;i<6;i++){ctx.fillStyle=i%2?'rgba(255,110,180,0.5)':'rgba(255,255,255,0.55)';ctx.beginPath();ctx.arc(100+i*155,285+(i%2)*30,24,0,Math.PI*2);ctx.fill();}
    } else if (world === 'farm') {
      ctx.fillStyle='rgba(255,215,90,0.75)';ctx.beginPath();ctx.arc(790,125,34,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=3;for(let x=25;x<960;x+=75){ctx.beginPath();ctx.moveTo(x,360);ctx.lineTo(x,430);ctx.stroke();ctx.beginPath();ctx.moveTo(x-9,370);ctx.lineTo(x+9,370);ctx.stroke();}
    } else if (world === 'ancient') {
      ctx.fillStyle='rgba(170,130,75,0.38)';ctx.fillRect(120,280,28,150);ctx.fillRect(112,270,44,12);ctx.fillRect(735,255,30,175);ctx.fillRect(727,245,46,12);
      ctx.strokeStyle='rgba(245,210,145,0.45)';ctx.lineWidth=3;ctx.strokeRect(300,320,120,110);
    } else if (world === 'clouds') {
      ctx.fillStyle='rgba(255,255,255,0.72)';for(let i=0;i<6;i++){const x=(i*183+(performance.now()*0.012)%1100)-80,y=100+(i%3)*65;ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.arc(x+27,y-10,33,0,Math.PI*2);ctx.arc(x+58,y,24,0,Math.PI*2);ctx.fill();}
    }
    ctx.restore();

    // زمین
    const groundColors = { forest:'#315b35', desert:'#c49a55', ocean:'#164a70', volcano:'#392b2b', space:'#25203b', neon:'#19172f', ice:'#c4e8ef', candy:'#e884b7', farm:'#6d9b45', ancient:'#74634b', clouds:'#dbe8f5' };
    ctx.fillStyle = seasonIdx === 3 ? '#e0f2f1' : (world === 'fruits' ? '#81c784' : (groundColors[world] || '#263238'));
    ctx.fillRect(0, GROUND_Y, 960, 540 - GROUND_Y);

    // خط افق
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(960, GROUND_Y);
    ctx.stroke();
  }

  // رسم کاراکتر همراه تغییر شکل متناسب با محیط و فشرده‌شدن
  function drawPlayer(world, alpha = 1) {
    const renderY = player.prevY + (player.y - player.prevY) * alpha;
    const renderScaleX = player.prevScaleX + (player.scaleX - player.prevScaleX) * alpha;
    const renderScaleY = player.prevScaleY + (player.scaleY - player.prevScaleY) * alpha;
    ctx.save();
    // جابجایی به مرکز قاعده کاراکتر برای اعمال اسکیل از پایین
    ctx.translate(player.x + player.w / 2, renderY + player.h);
    ctx.scale(renderScaleX, renderScaleY);

    const bobbing = player.grounded ? Math.sin(player.runTimer) * 2.5 : 0;

    if (world === 'blueprint') {
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 3;
      ctx.strokeRect(-player.w / 2, -player.h + bobbing, player.w, player.h);
      ctx.fillStyle = '#003344';
      ctx.fillRect(-player.w / 2, -player.h + bobbing, player.w, player.h);
    } else if (world === 'fruits') {
      // پرتقال / دانه گرد
      ctx.fillStyle = '#ff7043';
      ctx.beginPath();
      ctx.arc(0, -player.h / 2 + bobbing, player.w / 2, 0, Math.PI * 2);
      ctx.fill();
      // برگ بالای سر
      ctx.fillStyle = '#4caf50';
      ctx.fillRect(-4, -player.h + bobbing - 6, 8, 8);
    } else if (world === 'forest' || world === 'farm') {

  function updateWeather(seasonIdx) {
    weatherParticles.forEach(p => {
      if (seasonIdx === 0 || seasonIdx === 1) {
        p.x += p.vx * (seasonIdx === 0 ? .35 : .4) + Math.sin((simulationTime / (seasonIdx === 0 ? 700 : 500)) + p.rot) * (seasonIdx === 0 ? .25 : .3);

        p.x += p.vx; p.y += p.vy;
        if (p.y > GROUND_Y) { p.y = -10; p.x = Math.random() * 960; }
        if (p.x < 0) p.x = 960; if (p.x > 960) p.x = 0;

      if (seasonIdx === 2) p.rot += .04;

      if (seasonIdx === 3) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(0,0,p.size*.7,0,Math.PI*2); ctx.fill(); }
      else if (seasonIdx === 2) { ctx.rotate(p.rot); ctx.fillStyle='#ff7043'; ctx.beginPath(); ctx.ellipse(0,0,p.size,p.size*.55,.5,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(121,55,35,.7)'; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(-p.size*.7,0); ctx.lineTo(p.size*.7,0); ctx.stroke(); }
      else if (seasonIdx === 0) { if (p.size>4) { ctx.fillStyle='rgba(244,143,177,.78)'; for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.beginPath();ctx.arc(Math.cos(a)*p.size*.45,Math.sin(a)*p.size*.45,p.size*.28,0,Math.PI*2);ctx.fill();} ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(0,0,p.size*.16,0,Math.PI*2);ctx.fill(); } else { ctx.fillStyle='rgba(255,245,190,.7)';ctx.beginPath();ctx.arc(0,0,p.size*.55,0,Math.PI*2);ctx.fill(); } }
      else { ctx.shadowColor='#ff9f43';ctx.shadowBlur=8;ctx.fillStyle=p.size>4?'rgba(255,183,77,.8)':'rgba(255,224,130,.72)';ctx.beginPath();ctx.arc(0,0,p.size*.55,0,Math.PI*2);ctx.fill(); }
      ctx.restore();
    });
  }

  // برخورد مستطیلی با حاشیه نرم (Hitbox دقیق‌تر)
  function checkCollision(p, o) {
    const pad = 8;
    return (
      p.x + pad < o.x + o.w &&
      p.x + p.w - pad > o.x &&
      p.y + pad < o.y + o.h &&
      p.y + p.h > o.y
    );
  }

  function gameOver() {
    if (lifeLost) return;
    lifeLost = true;
    lives = Math.max(0, lives - 1);
    hitFlashTimer = 26;
    playSound('hit');
    gameContainer.classList.remove('life-hit');
    void gameContainer.offsetWidth;
    gameContainer.classList.add('life-hit');
    obstacles = [];
    dustParticles = [];
    spawnCooldown = 0;
    player.reset();
    worldTime = 8.0;
    resetWeather();
    isGameOver = false;
    if (lives <= 0) {
      lives = 3;
      dayCount = 0;
      score = 0;
      gameSpeed = 6;
      hasStarted = false;
      lifeLost = false;
    }
    lastLifeReset = simulationTime;
  }
  function restart() {
    obstacles = []; dustParticles = []; score = 0; gameSpeed = 6; isGameOver = false; spawnCooldown = 0; lifeLost = false; player.reset();
    worldTime = 8.0; resetWeather();
  }

  function updateSimulation() {
    simulationTime += FIXED_DT;
    if (hitFlashTimer > 0) hitFlashTimer--;
    if (lifeLost && simulationTime - lastLifeReset > 700) lifeLost = false;
    const currentSeasonIdx = Math.floor(dayCount / 3) % 4;
    if (!isGameOver && hasStarted) {
      const previousWorldTime = worldTime;
      worldTime = (worldTime + 0.02) % 24;
      // فقط هنگام عبور واقعی از 24:00 به 00:00 روز جدید را ثبت کن؛
      // زمان را به 08:00 نپرون تا بازهٔ شب (00:00 تا 06:00) حذف نشود.
      if (worldTime < previousWorldTime) dayCount++;
      score += .1; gameSpeed = 6 + Math.min(6, score * .005);
      player.update();
      spawnCooldown--;
      if (spawnCooldown <= 0) { spawnObstacle(); spawnCooldown = Math.floor(75 + Math.random()*60 - Math.min(30,score*.03)); }
      for (let i=obstacles.length-1;i>=0;i--) {
        const obs=obstacles[i]; obs.prevX = obs.x; obs.x -= gameSpeed;
        if (checkCollision(player,obs) && !lifeLost) { gameOver(); break; }
        if (obs.x+obs.w < -50) obstacles.splice(i,1);
      }
      updateWeather(currentSeasonIdx);
    }
  }

  function loop(timestamp) {
    if (previousFrameTime === null) previousFrameTime = timestamp;
    const frameDelta = Math.min(250, timestamp - previousFrameTime); previousFrameTime = timestamp; accumulator += frameDelta;
    while (accumulator >= FIXED_DT) { updateSimulation(); accumulator -= FIXED_DT; }
    const alpha = accumulator / FIXED_DT;
    const currentSeasonIdx = Math.floor(dayCount / 3) % 4;
    const currentWorldIdx = Math.floor(dayCount / 12) % worlds.length;
    const activeWorld = worlds[currentWorldIdx];
    const currentDay = dayCount + 1;
    const h = Math.floor(worldTime), m = Math.floor((worldTime % 1) * 60);
    const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    statsEl.innerText = `روز ${currentDay}`;
    envInfoEl.innerText = `محیط: ${activeWorld.name} | فصل: ${seasons[currentSeasonIdx]} | ساعت: ${timeStr}`;
    livesEl.innerText = `${'❤️ '.repeat(lives)}${'♡ '.repeat(3-lives)}`.trim();
    drawBackground(activeWorld.id,currentSeasonIdx); handleWeather(currentSeasonIdx);
    if (hasStarted) {
      drawPlayer(activeWorld.id, alpha); handleDust();
      obstacles.forEach(obs => drawObstacle(obs, alpha));
    }
    if (hitFlashTimer>0) { ctx.fillStyle=`rgba(255,35,35,${.10*(hitFlashTimer/26)})`;ctx.fillRect(0,0,960,540); }
    if (!hasStarted) { ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('برای شروع پرش کنید (Space یا لمس صفحه)',480,270); }
    requestAnimationFrame(loop);
  }

  // رویدادهای ورودی
  function triggerAction() {
    initAudio();
    if (!hasStarted) {
      hasStarted = true;
      restart();
    } else if (isGameOver) {
      restart();
    } else {
      player.jump();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      triggerAction();
    }
  });

  soundButton.addEventListener('click', e => { e.stopPropagation(); audioMuted = !audioMuted; soundButton.innerText = audioMuted ? '🔇' : '🔊'; soundButton.setAttribute('aria-label', audioMuted ? 'روشن‌کردن صدا' : 'قطع صدا'); soundButton.setAttribute('aria-pressed', String(audioMuted)); });
  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('#sound-button')) return;
    e.preventDefault(); triggerAction();
  }, {passive:false});

  requestAnimationFrame(loop);
})();
</script>
</body>
